services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow_test
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
